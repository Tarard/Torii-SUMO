[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torii-sumo"
version = "1.0.2"
description = "Torii agent plugin for evidence-aware Eclipse SUMO and OSM-to-SUMO workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [
  { name = "Torii contributors" }
]
dependencies = [
  "anyio>=4.0",
  "mcp[cli]>=1.0.0",
  "Pillow>=10.0",
  "pydantic>=2.7",
  "sumolib>=1.20",
  "traci>=1.20"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "PyYAML>=6.0",
  "ruff>=0.15"
]

[project.scripts]
torii-sumo = "torii_sumo.server:main"

[tool.setuptools.packages.find]
where = ["plugins/torii-sumo/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugins/torii-sumo/src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"experiments/junction_aggregation_strategy_probe.py" = ["E402"]
"plugins/torii-sumo/scripts/export_corridor_schema.py" = ["E402"]
"plugins/torii-sumo/scripts/export_synthetic_benchmark_schema.py" = ["E402"]
"plugins/torii-sumo/scripts/run_synthetic_fault_benchmark.py" = ["E402"]
"plugins/torii-sumo/scripts/run_torii_sumo.py" = ["E402"]
