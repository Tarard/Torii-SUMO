name: Full Python Suite

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: full-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up locked Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Lint package and tests
        run: ruff check plugins/torii-sumo/src tests

      - name: Report complexity debt without blocking yet
        continue-on-error: true
        run: |
          ruff check plugins/torii-sumo/src \
            --select C901,PLR0912,PLR0913,PLR0915 \
            --statistics

      - name: Run full test suite
        run: pytest -q
