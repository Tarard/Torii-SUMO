name: Full Python Suite

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: full-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up locked Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.30"
          enable-cache: true

      - name: Install package and development dependencies
        run: uv sync --frozen --extra dev

      - name: Lint package and tests
        run: uv run --frozen ruff check plugins/torii-sumo/src tests

      - name: Report complexity debt without blocking yet
        continue-on-error: true
        run: |
          uv run --frozen ruff check plugins/torii-sumo/src \
            --select C901,PLR0912,PLR0913,PLR0915 \
            --statistics

      - name: Run full test suite
        run: uv run --frozen pytest -q
