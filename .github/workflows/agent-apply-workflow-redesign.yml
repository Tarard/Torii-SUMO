name: agent-apply-workflow-redesign

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/evidence-workflow-manifest

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evidence-workflow-manifest
          fetch-depth: 0

      - name: Reconstruct and verify audited patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/agent/workflow-redesign.patch.part16')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          marker = '+diff --git a/tests/test_workflow_router.py b/tests/test_workflow_router.py'
          start = next(index for index, line in enumerate(lines) if line.startswith(marker))
          lines[start:] = [line[1:] if line.startswith('+') else line for line in lines[start:]]
          path.write_text(''.join(lines), encoding='utf-8')
          PY
          sha256sum .github/agent/workflow-redesign.patch.part* | sort
          cat .github/agent/workflow-redesign.patch.part* > /tmp/workflow-redesign.patch
          echo "419623a3212e0ab4844003559bcb541a75121d7a3fa29821f2fcb0e8b1def7bb  /tmp/workflow-redesign.patch" | sha256sum --check --strict
          git apply --check /tmp/workflow-redesign.patch
          git apply --index /tmp/workflow-redesign.patch
          rm -rf .github/agent
          rm -f .github/workflows/agent-apply-workflow-redesign.yml
          git add -A
          git diff --cached --check

      - name: Validate workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest PyYAML
          python -m compileall -q \
            plugins/torii-sumo/src/torii_sumo/core/workflow_manifest.py \
            plugins/torii-sumo/src/torii_sumo/tools/workflow_tools.py \
            plugins/torii-sumo/src/torii_sumo/server.py
          python -m json.tool schemas/torii.workflow-manifest.v1.schema.json >/dev/null
          python -m pytest \
            tests/test_workflow_manifest.py \
            tests/test_repository_navigation.py \
            tests/test_docs_plugin_install.py \
            tests/test_plugin_packaging.py \
            -q

      - name: Commit formal changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Agent"
          git config user.email "agent@openai.com"
          git commit -m "Add evidence-bound resumable workflow contracts"
          git push origin HEAD:agent/evidence-workflow-manifest
