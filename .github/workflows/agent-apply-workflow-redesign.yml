name: agent-apply-workflow-redesign

on:
  push:
    branches:
      - agent/evidence-workflow-manifest

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evidence-workflow-manifest
          fetch-depth: 0

      - name: Apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent/workflow-redesign.patch.gz.b64.* \
            | base64 --decode \
            | gzip --decompress > /tmp/workflow-redesign.patch
          git apply --check /tmp/workflow-redesign.patch
          git apply --index /tmp/workflow-redesign.patch
          rm -rf .github/agent
          rm -f .github/workflows/agent-apply-workflow-redesign.yml
          git add -A
          git diff --cached --check

      - name: Validate workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest PyYAML
          python -m compileall -q \
            plugins/torii-sumo/src/torii_sumo/core/workflow_manifest.py \
            plugins/torii-sumo/src/torii_sumo/tools/workflow_tools.py \
            plugins/torii-sumo/src/torii_sumo/server.py
          python -m json.tool schemas/torii.workflow-manifest.v1.schema.json >/dev/null
          python -m pytest \
            tests/test_workflow_manifest.py \
            tests/test_repository_navigation.py \
            tests/test_docs_plugin_install.py \
            tests/test_plugin_packaging.py \
            -q

      - name: Commit formal changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Agent"
          git config user.email "agent@openai.com"
          git commit -m "Add evidence-bound resumable workflow contracts"
          git push origin HEAD:agent/evidence-workflow-manifest
