name: Corridor Contract Freeze

on:
  push:
    branches:
      - html
      - "codex/**"
  pull_request:
    branches:
      - html

permissions:
  contents: read

jobs:
  stage-0-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up locked Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip

      - name: Install locked contract dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pydantic==2.13.4 \
            osmium==4.3.1 \
            pytest==9.1.1 \
            ruff==0.15.21
          python -m pip install --no-deps --editable .

      - name: Lint the frozen contract layer
        run: |
          ruff check \
            plugins/torii-sumo/src/torii_sumo/corridor \
            plugins/torii-sumo/scripts/export_composite_benchmark_schema.py \
            plugins/torii-sumo/scripts/export_corridor_schema.py \
            plugins/torii-sumo/scripts/export_official_sumo_benchmark_schema.py \
            plugins/torii-sumo/scripts/export_ood_benchmark_schema.py \
            plugins/torii-sumo/scripts/export_held_out_review_schema.py \
            plugins/torii-sumo/scripts/export_held_out_review_v2_schema.py \
            plugins/torii-sumo/scripts/export_stage1_review_ready_schema.py \
            plugins/torii-sumo/scripts/build_held_out_corpus.py \
            plugins/torii-sumo/scripts/build_held_out_corridor_evidence.py \
            plugins/torii-sumo/scripts/freeze_held_out_corpus.py \
            plugins/torii-sumo/scripts/freeze_held_out_review_v2.py \
            plugins/torii-sumo/scripts/freeze_held_out_replacement_execution_v2.py \
            plugins/torii-sumo/scripts/freeze_held_out_review_trial_v2_r2.py \
            plugins/torii-sumo/scripts/build_held_out_review_package_v2_r2.py \
            plugins/torii-sumo/scripts/freeze_stage1_machine_review_ready.py \
            plugins/torii-sumo/scripts/export_synthetic_benchmark_schema.py \
            plugins/torii-sumo/scripts/evaluate_held_out_review.py \
            plugins/torii-sumo/scripts/run_official_sumo_benchmark.py \
            plugins/torii-sumo/scripts/run_ood_benchmark.py \
            plugins/torii-sumo/scripts/run_composite_fault_benchmark.py \
            plugins/torii-sumo/scripts/run_synthetic_fault_benchmark.py \
            plugins/torii-sumo/scripts/run_pedestrian_row_experiment.py \
            tests/test_composite_fault_benchmark.py \
            tests/test_corridor_stage0_contracts.py \
            tests/test_held_out_review_trial.py \
            tests/test_held_out_review_v2.py \
            tests/test_held_out_review_v2_r2.py \
            tests/test_stage1_machine_review_ready.py \
            tests/test_held_out_corpus.py \
            tests/test_pedestrian_control_census.py \
            tests/test_pedestrian_row_oracle.py \
            tests/test_pedestrian_row_runtime.py \
            tests/test_review_compression.py \
            tests/test_official_sumo_benchmark.py \
            tests/test_ood_benchmark.py

      - name: Verify schema regeneration is deterministic
        run: |
          python plugins/torii-sumo/scripts/export_corridor_schema.py \
            --output generated.corridor.schema.json
          diff --unified \
            schemas/torii.corridor.research-bundle.v1.schema.json \
            generated.corridor.schema.json
          python plugins/torii-sumo/scripts/export_synthetic_benchmark_schema.py \
            --spec-output generated.synthetic-benchmark.schema.json \
            --report-output generated.synthetic-benchmark-report.schema.json
          diff --unified \
            schemas/torii.corridor.synthetic-fault-benchmark.v1.schema.json \
            generated.synthetic-benchmark.schema.json
          diff --unified \
            schemas/torii.corridor.synthetic-fault-benchmark-report.v1.schema.json \
            generated.synthetic-benchmark-report.schema.json
          python plugins/torii-sumo/scripts/export_composite_benchmark_schema.py \
            --spec-output generated.composite-benchmark.schema.json \
            --report-output generated.composite-benchmark-report.schema.json
          diff --unified \
            schemas/torii.corridor.composite-fault-benchmark.v1.schema.json \
            generated.composite-benchmark.schema.json
          diff --unified \
            schemas/torii.corridor.composite-fault-benchmark-report.v1.schema.json \
            generated.composite-benchmark-report.schema.json
          python plugins/torii-sumo/scripts/export_official_sumo_benchmark_schema.py \
            --spec-output generated.official-sumo-benchmark.schema.json \
            --report-output generated.official-sumo-benchmark-report.schema.json
          diff --unified \
            schemas/torii.corridor.official-sumo-benchmark.v1.schema.json \
            generated.official-sumo-benchmark.schema.json
          diff --unified \
            schemas/torii.corridor.official-sumo-benchmark-report.v1.schema.json \
            generated.official-sumo-benchmark-report.schema.json
          python plugins/torii-sumo/scripts/export_ood_benchmark_schema.py \
            --envelope-output generated.certification-envelope.schema.json \
            --applicability-output generated.certification-applicability.schema.json \
            --spec-output generated.ood-benchmark.schema.json \
            --report-output generated.ood-benchmark-report.schema.json
          diff --unified \
            schemas/torii.corridor.certification-envelope.v1.schema.json \
            generated.certification-envelope.schema.json
          diff --unified \
            schemas/torii.corridor.certification-applicability-report.v1.schema.json \
            generated.certification-applicability.schema.json
          diff --unified \
            schemas/torii.corridor.ood-benchmark.v1.schema.json \
            generated.ood-benchmark.schema.json
          diff --unified \
            schemas/torii.corridor.ood-benchmark-report.v1.schema.json \
            generated.ood-benchmark-report.schema.json
          python plugins/torii-sumo/scripts/export_held_out_review_schema.py \
            --policy-output generated.held-out-review-policy.schema.json \
            --bundle-output generated.held-out-review-bundle.schema.json \
            --report-output generated.held-out-review-report.schema.json \
            --corpus-output generated.held-out-corpus.schema.json \
            --corpus-report-output generated.held-out-corpus-report.schema.json \
            --corpus-machine-report-output generated.held-out-corpus-machine-report.schema.json \
            --run-identity-output generated.held-out-machine-run-identity.schema.json \
            --corpus-machine-manifest-output generated.held-out-corpus-machine-manifest.schema.json \
            --net-replay-report-output generated.net-replay-report.schema.json
          diff --unified \
            schemas/torii.corridor.held-out-review-policy.v1.schema.json \
            generated.held-out-review-policy.schema.json
          diff --unified \
            schemas/torii.corridor.held-out-review-contract-bundle.v1.schema.json \
            generated.held-out-review-bundle.schema.json
          diff --unified \
            schemas/torii.corridor.held-out-review-report.v1.schema.json \
            generated.held-out-review-report.schema.json
          diff --unified \
            schemas/torii.corridor.held-out-corpus.v1.schema.json \
            generated.held-out-corpus.schema.json
          diff --unified \
            schemas/torii.corridor.held-out-corpus-snapshot-report.v1.schema.json \
            generated.held-out-corpus-report.schema.json
          diff --unified \
            schemas/torii.corridor.held-out-corpus-machine-report.v2.schema.json \
            generated.held-out-corpus-machine-report.schema.json
          diff --unified \
            schemas/torii.corridor.held-out-machine-run-identity.v1.schema.json \
            generated.held-out-machine-run-identity.schema.json
          diff --unified \
            schemas/torii.corridor.held-out-corpus-machine-manifest.v2.schema.json \
            generated.held-out-corpus-machine-manifest.schema.json
          diff --unified \
            schemas/torii.corridor.net-replay-report.v1.schema.json \
            generated.net-replay-report.schema.json
          python plugins/torii-sumo/scripts/export_held_out_review_v2_schema.py \
            --reserve-output generated.held-out-reserve-corpus-v2.schema.json \
            --replacement-policy-output generated.held-out-replacement-policy-v2.schema.json \
            --replacement-plan-output generated.held-out-replacement-plan-v2.schema.json \
            --source-snapshot-protocol-output generated.held-out-source-snapshot-protocol-v2.schema.json \
            --replacement-attempt-ledger-output generated.held-out-replacement-attempt-ledger-v2.schema.json \
            --sampling-policy-output generated.review-witness-sampling-policy-v2.schema.json \
            --parent-output generated.held-out-review-parent-v2.schema.json \
            --policy-output generated.held-out-review-policy-v2.schema.json \
            --bundle-output generated.held-out-review-bundle-v2.schema.json \
            --report-output generated.held-out-review-report-v2.schema.json \
            --study-sampling-policy-r2-output generated.review-study-sampling-policy-v2-r2.schema.json \
            --execution-parent-r2-output generated.held-out-review-execution-parent-v2-r2.schema.json \
            --trial-instance-r2-output generated.held-out-review-trial-instance-v2-r2.schema.json \
            --blinded-dataset-r2-output generated.blinded-attention-dataset-v2-r2.schema.json \
            --evaluation-key-r2-output generated.attention-evaluation-key-v2-r2.schema.json \
            --sampling-ledger-r2-output generated.review-sampling-ledger-v2-r2.schema.json \
            --unit-decision-r2-output generated.review-unit-decision-v2-r2.schema.json \
            --unit-adjudication-r2-output generated.review-unit-adjudication-v2-r2.schema.json \
            --package-manifest-r2-output generated.held-out-review-package-manifest-v2-r2.schema.json
          diff --unified \
            schemas/torii.corridor.held-out-reserve-corpus.v2.schema.json \
            generated.held-out-reserve-corpus-v2.schema.json
          diff --unified \
            schemas/torii.corridor.held-out-replacement-policy.v2.schema.json \
            generated.held-out-replacement-policy-v2.schema.json
          diff --unified \
            schemas/torii.corridor.held-out-replacement-plan.v2.schema.json \
            generated.held-out-replacement-plan-v2.schema.json
          diff --unified \
            schemas/torii.corridor.held-out-source-snapshot-protocol.v2.schema.json \
            generated.held-out-source-snapshot-protocol-v2.schema.json
          diff --unified \
            schemas/torii.corridor.held-out-replacement-attempt-ledger.v2.schema.json \
            generated.held-out-replacement-attempt-ledger-v2.schema.json
          diff --unified \
            schemas/torii.corridor.review-witness-sampling-policy.v2.schema.json \
            generated.review-witness-sampling-policy-v2.schema.json
          diff --unified \
            schemas/torii.corridor.held-out-review-parent.v2.schema.json \
            generated.held-out-review-parent-v2.schema.json
          diff --unified \
            schemas/torii.corridor.held-out-review-policy.v2.schema.json \
            generated.held-out-review-policy-v2.schema.json
          diff --unified \
            schemas/torii.corridor.held-out-review-contract-bundle.v2.schema.json \
            generated.held-out-review-bundle-v2.schema.json
          diff --unified \
            schemas/torii.corridor.held-out-review-report.v2.schema.json \
            generated.held-out-review-report-v2.schema.json
          diff --unified \
            schemas/torii.corridor.review-study-sampling-policy.v2-r2.schema.json \
            generated.review-study-sampling-policy-v2-r2.schema.json
          diff --unified \
            schemas/torii.corridor.held-out-review-execution-parent.v2-r2.schema.json \
            generated.held-out-review-execution-parent-v2-r2.schema.json
          diff --unified \
            schemas/torii.corridor.held-out-review-trial-instance.v2-r2.schema.json \
            generated.held-out-review-trial-instance-v2-r2.schema.json
          diff --unified \
            schemas/torii.corridor.blinded-attention-dataset.v2-r2.schema.json \
            generated.blinded-attention-dataset-v2-r2.schema.json
          diff --unified \
            schemas/torii.corridor.attention-evaluation-key.v2-r2.schema.json \
            generated.attention-evaluation-key-v2-r2.schema.json
          diff --unified \
            schemas/torii.corridor.review-sampling-ledger.v2-r2.schema.json \
            generated.review-sampling-ledger-v2-r2.schema.json
          diff --unified \
            schemas/torii.corridor.review-unit-decision.v2-r2.schema.json \
            generated.review-unit-decision-v2-r2.schema.json
          diff --unified \
            schemas/torii.corridor.review-unit-adjudication.v2-r2.schema.json \
            generated.review-unit-adjudication-v2-r2.schema.json
          diff --unified \
            schemas/torii.corridor.held-out-review-package-manifest.v2-r2.schema.json \
            generated.held-out-review-package-manifest-v2-r2.schema.json
          python plugins/torii-sumo/scripts/export_stage1_review_ready_schema.py \
            --program-inventory-output generated.effective-tls-program-inventory.schema.json \
            --binding-census-output generated.controlled-pedestrian-binding-census.schema.json \
            --atomic-conflict-ledger-output generated.atomic-conflict-ledger.schema.json \
            --review-compression-output generated.lossless-review-compression.schema.json \
            --row-experiment-output generated.row-1-experiment-report.schema.json \
            --machine-review-ready-provenance-output generated.stage1m-machine-review-ready-provenance.schema.json
          diff --unified \
            schemas/torii.corridor.effective-tls-program-inventory.v1.schema.json \
            generated.effective-tls-program-inventory.schema.json
          diff --unified \
            schemas/torii.corridor.controlled-pedestrian-binding-census.v1.schema.json \
            generated.controlled-pedestrian-binding-census.schema.json
          diff --unified \
            schemas/torii.corridor.atomic-conflict-ledger.v1.schema.json \
            generated.atomic-conflict-ledger.schema.json
          diff --unified \
            schemas/torii.corridor.lossless-review-compression.v1.schema.json \
            generated.lossless-review-compression.schema.json
          diff --unified \
            schemas/torii.corridor.row-1-experiment-report.v1.schema.json \
            generated.row-1-experiment-report.schema.json
          diff --unified \
            schemas/torii.corridor.stage1m-machine-review-ready-provenance.v3.schema.json \
            generated.stage1m-machine-review-ready-provenance.schema.json
          python plugins/torii-sumo/scripts/freeze_held_out_corpus.py \
            --output generated.held-out-corpus.json
          diff --unified \
            benchmarks/corridor_human_modeling_v1/held_out_corpus.v1.json \
            generated.held-out-corpus.json
          python plugins/torii-sumo/scripts/freeze_held_out_review_v2.py \
            --reserve-output generated.held-out-reserve-corpus-v2.json \
            --replacement-policy-output generated.held-out-replacement-policy-v2.json \
            --sampling-policy-output generated.review-witness-sampling-policy-v2.json \
            --parent-output generated.held-out-review-parent-v2.json \
            --review-policy-output generated.held-out-review-policy-v2.json \
            --replacement-plan-output generated.held-out-replacement-plan-v2.json
          diff --unified \
            benchmarks/corridor_human_modeling_v1/held_out_reserve_corpus.v2.json \
            generated.held-out-reserve-corpus-v2.json
          diff --unified \
            benchmarks/corridor_human_modeling_v1/held_out_replacement_policy.v2.json \
            generated.held-out-replacement-policy-v2.json
          diff --unified \
            benchmarks/corridor_human_modeling_v1/review_witness_sampling_policy.v2.json \
            generated.review-witness-sampling-policy-v2.json
          diff --unified \
            benchmarks/corridor_human_modeling_v1/held_out_review_parent.v2.json \
            generated.held-out-review-parent-v2.json
          diff --unified \
            benchmarks/corridor_human_modeling_v1/held_out_review_preregistration.v2.json \
            generated.held-out-review-policy-v2.json
          diff --unified \
            benchmarks/corridor_human_modeling_v1/held_out_replacement_plan.v2.json \
            generated.held-out-replacement-plan-v2.json

      - name: Verify benchmark, toolchain, plan, and fail-closed contracts
        run: |
          pytest \
            tests/test_composite_fault_benchmark.py \
            tests/test_corridor_stage0_contracts.py \
            tests/test_held_out_review_trial.py \
            tests/test_held_out_review_v2.py \
            tests/test_held_out_review_v2_r2.py \
            tests/test_stage1_machine_review_ready.py \
            tests/test_held_out_corpus.py \
            tests/test_pedestrian_control_census.py \
            tests/test_pedestrian_row_oracle.py \
            tests/test_pedestrian_row_runtime.py \
            tests/test_review_compression.py \
            tests/test_official_sumo_benchmark.py \
            tests/test_ood_benchmark.py \
            tests/test_synthetic_fault_benchmark.py \
            -q
